# DESIGN.md Spec Configuration
# This file is the single source of truth for the DESIGN.md format specification.
# Edit this file, then run `bun run spec:gen` to regenerate docs/spec.md.

version: alpha

# Performance and safety limits for the model handler.
limits:
  max_token_nesting_depth: 20
  max_reference_depth: 10

units:
  - px
  - em
  - rem

types:
  Color:
    description: "A color value is any valid CSS color string. Supported formats include:"
    formats:
      - "Hex: `#RGB`, `#RGBA`, `#RRGGBB`, `#RRGGBBAA`"
      - "Named colors: `red`, `cornflowerblue`, `transparent`"
      - "Functional: `rgb()`, `rgba()`, `hsl()`, `hsla()`, `hwb()`"
      - "Wide-gamut: `oklch()`, `oklab()`, `lch()`, `lab()`"
      - "Mixing: `color-mix(in srgb, ...)`"
    note: All color values are internally converted to sRGB for WCAG contrast checking. The original format is preserved for display and export.
    recommendation: Hex notation (`#RRGGBB`) remains the recommended default for simplicity and broad tooling support.
  Dimension:
    description: "A dimension value is a string with a unit suffix."
    units:
      - px
      - em
      - rem
  Duration:
    description: "A duration value is a string with a `ms` unit suffix (e.g., `100ms`, `250ms`)."

sections:
  - canonical: Overview
    aliases:
      - Brand & Style
  - canonical: Colors
  - canonical: Typography
  - canonical: Layout
    aliases:
      - Layout & Spacing
  - canonical: Elevation & Depth
    aliases:
      - Elevation
  - canonical: Shapes
  - canonical: Motion & Micro-interaction
    aliases:
      - Motion & Micro-interactions
      - Motion
  - canonical: Components
  - canonical: "Do's and Don'ts"

typography_properties:
  - name: fontFamily
    type: string
  - name: fontSize
    type: Dimension
  - name: fontWeight
    type: number
    description: "A numeric font weight value (e.g., `400`, `700`). In YAML, this may be expressed as either a bare number or a quoted string; both are equivalent."
  - name: lineHeight
    type: "Dimension | number"
    description: "Accepts either a Dimension (e.g., `24px`, `1.5rem`) or a unitless number (e.g., `1.6`). A unitless number represents a multiplier of the element's `fontSize`, which is the recommended CSS practice."
  - name: letterSpacing
    type: Dimension
  - name: fontFeature
    type: string
    description: "configures\n  [`font-feature-settings`](https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/font-feature-settings)."
  - name: fontVariation
    type: string
    description: "configures\n  [`font-variation-settings`](https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/font-variation-settings)."

motion_properties:
  - name: duration
    type: Duration
    description: "The length of time a transition takes to complete (e.g., `100ms`, `250ms`)."
  - name: delay
    type: Duration
    description: "The time to wait before a transition starts (e.g., `0ms`, `50ms`)."
  - name: timingFunction
    type: string
    description: "A CSS easing function such as `linear`, `ease`, `ease-in`, `ease-out`, `ease-in-out`, `steps(...)`, or `cubic-bezier(...)`."

component_sub_tokens:
  - name: backgroundColor
    type: Color
  - name: textColor
    type: Color
  - name: typography
    type: Typography
  - name: rounded
    type: Dimension
  - name: padding
    type: Dimension
  - name: size
    type: Dimension
  - name: height
    type: Dimension
  - name: width
    type: Dimension

color_roles:
  - primary
  - secondary
  - tertiary
  - neutral

recommended_tokens:
  colors:
    - primary
    - secondary
    - tertiary
    - neutral
    - surface
    - on-surface
    - error
  typography:
    - headline-display
    - headline-lg
    - headline-md
    - body-lg
    - body-md
    - body-sm
    - label-lg
    - label-md
    - label-sm
  rounded:
    - none
    - sm
    - md
    - lg
    - xl
    - full
  motion:
    - state-change
    - surface-enter
    - surface-exit

examples:
  colors:
    primary: "#1A1C1E"
    secondary: "#6C7278"
    tertiary: "#B8422E"
    neutral: "#F7F5F2"
  typography:
    h1:
      fontFamily: Public Sans
      fontSize: 48px
      fontWeight: 600
      lineHeight: 1.1
      letterSpacing: "-0.02em"
    body-md:
      fontFamily: Public Sans
      fontSize: 16px
      fontWeight: 400
      lineHeight: 1.6
    label-caps:
      fontFamily: Space Grotesk
      fontSize: 12px
      fontWeight: 500
      lineHeight: 1.0
      letterSpacing: "0.1em"
  motion:
    state-change:
      duration: 100ms
      delay: 0ms
      timingFunction: ease-out
    surface-enter:
      duration: 250ms
      delay: 0ms
      timingFunction: "cubic-bezier(0.2, 0, 0, 1)"
    surface-exit:
      duration: 150ms
      delay: 0ms
      timingFunction: "cubic-bezier(0.3, 0, 1, 1)"
  components:
    button-primary:
      backgroundColor: "{colors.primary-60}"
      textColor: "{colors.primary-20}"
      rounded: "{rounded.md}"
      padding: 12px
    button-primary-hover:
      backgroundColor: "{colors.primary-70}"
